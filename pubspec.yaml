name: paytrail
description: "Freelance payment tracking, aging and reminders for Indian freelancers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Storage
  drift: ^2.35.0
  sqlite3: ^3.5.2
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0

  # State
  flutter_riverpod: ^3.4.3

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  cryptography: ^2.7.0
  collection: ^1.19.1
  csv: ^8.0.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.4
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  syncfusion_flutter_pdf: ^35.1.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.0

# Bundle the SQLCipher build of SQLite instead of vanilla SQLite, so the
# on-device database file is encrypted at rest (see lib/data/db/database.dart).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
